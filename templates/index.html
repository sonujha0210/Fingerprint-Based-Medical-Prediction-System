<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blood Group, Gender & Eye Disease Prediction</title>

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Poppins", sans-serif;
        background-color: #f4f6f9;
      }
      .container {
        max-width: 600px;
        margin-top: 50px;
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        text-align: center;
      }
      h2 {
        font-weight: 600;
        margin-bottom: 20px;
        color: #333;
      }
      .form-control {
        margin-bottom: 10px;
      }
      .btn {
        width: 100%;
        font-size: 16px;
        font-weight: 600;
        margin-top: 10px;
      }
      video,
      canvas {
        width: 100%;
        border-radius: 10px;
        margin-top: 15px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>Blood Group, Gender & Eye Disease Prediction</h2>

      <!-- Blood Group and Gender Prediction Form -->
      <form action="/predict" method="post" enctype="multipart/form-data">
        <input
          type="file"
          id="file"
          name="file"
          class="form-control"
          accept="image/*"
          required
        />
        <button type="submit" class="btn btn-primary">
          Predict Blood_Group and Gender of the Fingerprint
        </button>
      </form>

      <hr />

      <!-- Live Camera Preview -->

      <video id="video" autoplay></video>
      <button id="capture-btn" class="btn btn-success">
        Capture and Predict Eye Disease
      </button>

      <form
        id="capture-form"
        action="/capture"
        method="post"
        enctype="multipart/form-data"
        style="display: none"
      >
        <input type="hidden" name="image_data" id="image_data" />
      </form>
    </div>

    <script>
      const video = document.getElementById("video");
      const captureBtn = document.getElementById("capture-btn");
      const captureForm = document.getElementById("capture-form");
      const imageDataInput = document.getElementById("image_data");

      if (navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices
          .getUserMedia({ video: true })
          .then(function (stream) {
            video.srcObject = stream;
          })
          .catch(function (error) {
            alert("Error accessing camera: " + error);
          });
      }

      captureBtn.addEventListener("click", function () {
        const canvas = document.createElement("canvas");
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const imageDataURL = canvas.toDataURL("image/jpeg");
        imageDataInput.value = imageDataURL;
        captureForm.submit();
      });
    </script>
  </body>
</html>
